name: Verify EN16931 oracle receipts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SaxonC-HE 13.0
        run: python3 -m pip install --disable-pip-version-check -q saxonche==13.0.0
      - name: Re-run receipts and compare RESULTS.sha256
        env:
          ORACLE_ROOT: ${{ github.workspace }}
        run: python3 scripts/verify_receipts.py
      - name: Re-run gaps receipts and compare pinned artifacts
        env:
          ORACLE_ROOT: ${{ github.workspace }}
        run: python3 scripts/verify_gaps_receipts.py
      - name: Gaps proof gate unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Checkout must stay clean after all replays
        run: |
          git diff --exit-code -- .
          if [ -n "$(git status --porcelain)" ]; then
            echo "Working tree not clean after replays:"
            git status --porcelain
            exit 1
          fi
